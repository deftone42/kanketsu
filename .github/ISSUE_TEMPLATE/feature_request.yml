name: Feature request
description: Suggest something Kanketsu should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like it to do?
    validations:
      required: true

  - type: checkboxes
    id: roadmap
    attributes:
      label: Before submitting
      options:
        - label: I checked ROADMAP.md and this is not already planned.
